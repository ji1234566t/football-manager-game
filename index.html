<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>足球经理总监</title><style>
:root{--bg:#0a0e17;--card:#141c2b;--line:#25344f;--blue:#3b82f6;--green:#22c55e;--red:#ef4444;--muted:#94a3b8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#e5edf8;font:15px system-ui,-apple-system,sans-serif}button,input,textarea,select{font:inherit}button{min-height:46px;border:1px solid var(--line);border-radius:10px;background:#1d2a40;color:#fff;padding:0 14px;cursor:pointer}button.primary{background:var(--blue);border-color:var(--blue)}button.good{background:#166534;border-color:#22c55e}.wrap{max-width:1000px;margin:auto;padding:18px 18px 96px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.top h1{font-size:22px;margin:0}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}.stat{font-size:28px;font-weight:700}.tabs{display:flex;gap:8px;overflow:auto;margin:15px 0}.tabs button{white-space:nowrap}.tabs button.active{background:var(--blue)}.page{display:none}.page.active{display:block}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.bar{height:8px;background:#26344b;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue)}textarea,input,select{width:100%;background:#0f1726;color:#fff;border:1px solid var(--line);border-radius:9px;padding:12px;outline:none}textarea{min-height:110px;resize:vertical}.field{flex:1;min-width:180px}.list{max-height:440px;overflow:auto}.player{display:grid;grid-template-columns:1fr auto;gap:4px;padding:12px 0;border-bottom:1px solid #203049}.pill{display:inline-block;background:#223451;border-radius:999px;padding:3px 8px;font-size:12px;margin:2px}.green{color:#86efac}.red{color:#fca5a5}.yellow{color:#fde68a}.log{max-height:260px;overflow:auto;background:#0d1421;padding:12px;border-radius:10px;line-height:1.8}.bottom{position:fixed;bottom:0;left:0;right:0;background:#101827;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5}.bottom button{border:0;border-radius:0;background:transparent;font-size:12px;padding:4px 10px;min-height:58px}.bottom button.active{color:#60a5fa}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center;z-index:10}.modal.open{display:flex}.modal>div{background:var(--card);border:1px solid var(--line);border-radius:16px 16px 0 0;width:min(680px,100%);max-height:88vh;overflow:auto;padding:18px}.notice{padding:10px;border-left:3px solid var(--blue);background:#101b2d;margin:8px 0}@media(min-width:700px){.modal{align-items:center}.modal>div{border-radius:16px}}
</style></head><body><main class="wrap"><header class="top"><h1>⚽ 足球经理总监</h1><span id="week" class="muted">第1周</span></header><div id="app"></div></main><nav class="bottom" id="nav"></nav><div class="modal" id="modal"><div id="modalBody"></div></div>
<script>
const SRC='https://raw.githubusercontent.com/ismailoksuz/EAFC26-DataHub/main/data/players.csv';
const pages=[['home','📊主页'],['squad','👥阵容'],['match','⚽比赛'],['story','🎙️叙事'],['finance','🏦财政'],['save','💾存档']];let state={page:'home',club:'曼彻斯特蓝',week:1,budget:180000000,trust:72,media:55,fan:68,room:70,score:[0,0],players:[],commitments:[],memories:[],logs:['欢迎执教。每个选择都会留下记忆。'],stats:{shots:0,on:0,corners:0,fouls:0},matchMinute:0,matchTimer:null};
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){const x={...state,players:[]};localStorage.setItem('fm_runtime',JSON.stringify(x));$('week').textContent='第'+state.week+'周'}function load(){try{const x=JSON.parse(localStorage.getItem('fm_runtime'));if(x)state={...state,...x}}catch(e){}}
function nav(){ $('nav').innerHTML=pages.map(([id,n])=>`<button class="${state.page===id?'active':''}" onclick="go('${id}')">${n}</button>`).join('') }
function go(p){state.page=p;nav();render()}
function render(){const a=$('app');a.innerHTML=state.page==='home'?home():state.page==='squad'?squad():state.page==='match'?match():state.page==='story'?story():state.page==='finance'?finance():saves()}
function home(){return `<section><div class="card"><div class="muted">当前俱乐部</div><h2>${esc(state.club)}</h2><div class="row"><button class="primary" onclick="press()">赛前发布会</button><button onclick="dialogue()">更衣室事件</button><button onclick="play()">开始比赛</button></div></div><div class="grid">${metric('董事会信任',state.trust)}${metric('媒体声望',state.media)}${metric('球迷声望',state.fan)}${metric('更衣室支持',state.room)}</div><div class="card"><h3>最新叙事</h3>${state.logs.slice(-5).reverse().map(x=>`<div class="notice">${esc(x)}</div>`).join('')}</div></section>`}
function metric(n,v){return `<div class="card"><div class="muted">${n}</div><div class="stat">${Math.round(v)}</div><div class="bar"><i style="width:${Math.max(0,Math.min(100,v))}%"></i></div></div>`}
function squad(){let ps=state.players;return `<section><div class="card"><h2>阵容</h2><p class="muted">完整数据导入后，原始字段会逐条保留；列表按需渲染。</p><div class="row"><button class="primary" onclick="importData()">导入 EA FC26 全量 CSV</button><input id="filter" placeholder="搜索球员/俱乐部/位置" oninput="filterPlayers(this.value)"></div><div id="plist" class="list">${playersHTML(ps.slice(0,100))}</div></div></section>`}
function playersHTML(ps){return ps.length?ps.map(p=>`<div class="player"><div><b>${esc(p.姓名||p.raw?.Name||'未命名')}</b><br><span class="pill">${esc(p.位置||p.raw?.Position||'未知')}</span><span class="pill">OVR ${esc(p.OVR||p.raw?.Overall||'-')}</span><span class="pill">${esc(p.所属俱乐部||p.raw?.Club||'')}</span></div><div class="muted">${esc(p.年龄||p.raw?.Age||'')}岁</div></div>`).join(''):'<p class="muted">尚未导入数据。点击按钮从公开数据源分批写入浏览器数据库。</p>'}
function filterPlayers(q){q=q.toLowerCase();let ps=state.players.filter(p=>JSON.stringify(p).toLowerCase().includes(q));$('plist').innerHTML=playersHTML(ps.slice(0,150))}
function match(){return `<section><div class="card"><h2>比赛中心</h2><div class="row" style="justify-content:space-between"><b>${state.club}</b><span class="stat">${state.score[0]} - ${state.score[1]}</span><b>红城竞技</b></div><p>比赛时间：${state.matchMinute}'　射门 ${state.stats.shots}　射正 ${state.stats.on}　角球 ${state.stats.corners}　犯规 ${state.stats.fouls}</p><div class="log" id="matchlog">${state.logs.slice(-15).map(esc).join('<br>')}</div><div class="row"><button class="primary" onclick="play()">${state.matchTimer?'比赛进行中':'开始/继续比赛'}</button><button onclick="stopMatch()">暂停</button></div></div></section>`}
function story(){return `<section><div class="card"><h2>叙事关系引擎</h2><p>发布会、私下对话、媒体标题、董事会记忆和承诺账本统一记录。</p><button class="primary" onclick="press()">进入发布会</button> <button onclick="dialogue()">处理球员对话</button></div><div class="card"><h3>承诺账本</h3>${state.commitments.length?state.commitments.map(c=>`<div class="notice"><b>${esc(c.text)}</b><br>对象：${esc(c.player)}　截止：${esc(c.deadline)}　状态：${esc(c.status)}</div>`).join(''):'<span class="muted">暂无承诺</span>'}</div></section>`}
function finance(){return `<section><div class="card"><h2>财政</h2><div class="grid">${metric('转会预算',Math.round(state.budget/1000000)+'M')}${metric('薪资预算',72)}${metric('赛季收入',38)}</div><p class="muted">预算变化会受转会、比赛收入和处罚影响。</p></div></section>`}
function saves(){return `<section><div class="card"><h2>存档管理</h2><p>当前：${esc(state.club)} · 第${state.week}周</p><div class="row"><button class="good" onclick="save();alert('已保存')">保存当前进度</button><button onclick="load();render()">加载进度</button><button onclick="localStorage.removeItem('fm_runtime');location.reload()">清空存档</button></div><p class="muted">运行状态保存在浏览器本地；球员静态数据使用 IndexedDB。</p></div></section>`}
function openModal(html){$('modalBody').innerHTML=html+`<button style="margin-top:12px" onclick="closeModal()">关闭</button>`;$('modal').classList.add('open')}function closeModal(){$('modal').classList.remove('open')}
function press(){openModal(`<h2>赛前发布会</h2><p>记者：球队最近状态起伏，你会把责任归咎于谁？</p><textarea id="answer" placeholder="自由回答，系统会结合上下文解析立场、情绪、目标、攻击性、真诚度与承诺"></textarea><button class="primary" onclick="analyzePress()">发布回答</button><div id="analysis"></div>`)}
function analyzePress(){let t=$('answer').value.trim()||'我们会团结起来继续努力。',bad=/歧视|种族|弄死|踢断腿|收钱|黑哨|管理层垃圾/.test(t),attack=/裁判|偏袒|骗子|废了|垃圾|不努力|甩锅/.test(t),promise=/争冠|保级|首发|出场|转会|一定会/.test(t);let stance=promise?'承诺':attack?'批评':'支持',emotion=/愤怒|生气|荒唐/.test(t)?'愤怒':/哈哈|笑/.test(t)?'讽刺':'冷静',ag=Math.min(10,(attack?5:1)+(bad?5:0)+(t.length>45?1:0)),risk=bad?'严重':attack?'中等':'轻微';state.media+=bad?-8:attack?-3:2;state.fan+=attack?2:1;state.room+=attack?-5:2;state.trust+=bad?-50:attack?-2:1;state.logs.push(`发布会：${stance}/${emotion}，目标${attack?'裁判或球员':'球队'}，攻击性${ag}，风险${risk}`);if(promise)state.commitments.push({text:t,player:'全队',deadline:'下一场比赛',status:'未兑现'});if(bad)state.logs.push('董事会：歧视或暴力言论触发立即解雇。');else if(attack)state.logs.push('媒体标题：主帅的言论引发争议；记者将继续追问。');save();$('analysis').innerHTML=`<div class="notice"><b>解析结果</b><br>立场：${stance}　情绪：${emotion}　攻击性：${ag}/10　真诚度：${Math.max(1,9-ag)}/10<br>三类听众：媒体${attack?'围剿':'关注'}；更衣室${attack?'部分不满':'支持'}；董事会${bad?'立即处理':'提醒谨慎'}<br>记者追问：“你是在暗示有人需要为失利负责吗？”</div>`;render()}
function dialogue(){openModal(`<h2>更衣室对话</h2><p>队长：有球员连续替补，希望你给出解释。</p><textarea id="talk" placeholder="例如：杯赛我给你首发，我说到做到。"></textarea><button class="primary" onclick="analyzeTalk()">回应球员</button><div id="talkResult"></div>`)}
function analyzeTalk(){let t=$('talk').value.trim()||'我们会沟通，你需要继续努力。',promise=/首发|出场|核心|给你机会|一定/.test(t),hard=/必须|不服|滚|威胁|否则/.test(t),act=promise?'承诺':hard?'威胁':/努力|相信|支持|理解/.test(t)?'激励':'冷处理';state.room+=hard?-8:promise?4:act==='激励'?3:-2;if(promise)state.commitments.push({text:t,player:'队长会议对象',deadline:'下一场比赛',status:'未兑现'});state.memories.push('更衣室对话：'+act);state.logs.push(`球员对话：${act}，${promise?'已写入承诺账本':'未产生公开承诺'}`);save();$('talkResult').innerHTML=`<div class="notice">意图：${act}<br>球员反应：${hard?'认为你在施压':promise?'暂时信任你，但会检查是否兑现':'认为你回避了问题'}</div>`;render()}
function play(){if(state.matchTimer)return;state.matchTimer=setInterval(()=>{state.matchMinute++;if(Math.random()<.055){state.stats.shots++;if(Math.random()<.35){state.stats.on++;if(Math.random()<.22){state.score[Math.random()<.5?0:1]++;state.logs.push(`${state.matchMinute}' ⚽ 进球！比赛形势改变。`)}else state.logs.push(`${state.matchMinute}' 射正，被门将扑出。`)}else state.logs.push(`${state.matchMinute}' 射门偏出。`)}else if(Math.random()<.25){state.stats.fouls++;state.logs.push(`${state.matchMinute}' 犯规，裁判判罚任意球。`)}else state.logs.push(`${state.matchMinute}' 中场传递与争抢。`)}if(state.matchMinute>=90){stopMatch();state.week++;state.logs.push(`全场结束：${state.score[0]}-${state.score[1]}，进入下一周。`);save()}render()},250);render()}function stopMatch(){if(state.matchTimer){clearInterval(state.matchTimer);state.matchTimer=null}render()}
async function importData(){try{const r=await fetch(SRC);if(!r.ok)throw Error(r.status);const text=await r.text(),lines=text.split(/\r?\n/).filter(Boolean),head=csv(lines[0]),rows=[];for(let i=1;i<lines.length;i++){let c=csv(lines[i]),raw={};head.forEach((h,j)=>raw[h]=c[j]||'');rows.push({id:String(raw.ID||raw.id||i),姓名:raw.Name||raw.name||'',位置:raw.Position||raw.position||'',年龄:raw.Age||raw.age||'',OVR:raw.Overall||raw.OVR||'',所属俱乐部:raw.Club||raw.club||'',raw})}let db=await idb();let tx=db.transaction('players','readwrite'),s=tx.objectStore('players');rows.forEach(p=>s.put(p));tx.oncomplete=()=>{state.players=rows;save();alert(`已保留 ${rows.length} 条原始记录及全部字段`);render()}}catch(e){alert('导入失败：'+e.message)}}function csv(l){let a=[],v='',q=false;for(let i=0;i<l.length;i++){if(l[i]=='"'&&l[i+1]=='"'){v+='"';i++}else if(l[i]=='"')q=!q;else if(l[i]==','&&!q){a.push(v);v=''}else v+=l[i]}a.push(v);return a}function idb(){return new Promise((res,rej)=>{let r=indexedDB.open('fm_game_db_v2',1);r.onupgradeneeded=()=>r.result.createObjectStore('players',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
load();nav();render();
</script></body></html>
